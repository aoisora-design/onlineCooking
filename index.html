<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン料理教室 キッチン・ブルーム Kitchen Bloom</title>
    <meta name="description" content="">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Shippori+Mincho&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">  
</head>
<body>
    <div class="wrapper">
        <header class="kv">
            <h1 class="kv-logo">
                <img src="img/logo.png" alt="">
            </h1>
            <p class="kv-copy">忙しくても、<br>ちゃんと食べたい。</p>
            <p class="kv-sub-copy">忙しい女性のためのオンライン料理教室</p>
            <div class="kv-content">
                <p class="kv-content-copy">好きな時間に、自宅で個別レッスン</p>
                <p class="kv-content-txt">月額：<strong>2,980</strong>円（税込）</p>
                <p class="btn"><a class="btn-link" href="">初回限定！無料体験はこちら</a></p>
            </div>
        </header>
        <section class="onayami">
            <div class="onayami-ttl">
                <p class="onayami-ttl-txt">毎日の料理づくり、こんな悩みがありませんか？</p>
            </div>
            <div class="onayami-content">
                <ul class="onayami-content-list">
                    <li class="onayami-content-txt">毎日献立を考えるのに悩む</li>
                    <li class="onayami-content-txt">手軽で簡単な料理ばかりになってしまう</li>
                    <li class="onayami-content-txt">同じメニューが続いてレパートリーが少ない</li>
                    <li class="onayami-content-txt">家族に栄養のある料理を作りたい</li>
                    <li class="onayami-content-txt">料理教室に通う時間がない</li>
                    <li class="onayami-content-txt">栄養を考えながら料理するのが大変</li>
                </ul>
                <div class="onayami-content-img-box">
                    <img src="img/onayami.jpg" alt="">
                </div>
            </div>        
        </section>
    </div>
</body>
</html>
